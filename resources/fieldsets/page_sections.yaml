title: 'Page sections'
fields:
  -
    handle: page_sections
    field:
      type: replicator
      display: 'Page sections'
      collapse: accordion
      sets:
        items:
          display: Items
          sets:
            intro:
              display: Intro
              fields:
                - import: intro
            benefits:
              display: Benefits
              fields:
                - import: benefits
            seo_text:
              display: 'Seo text'
              fields:
                - import: seo_text
            featured_cars:
              display: 'Featured cars'
              fields:
                - import: featured_cars
            cta:
              display: CTA
              fields:
                - import: cta
            featured_testimonials:
              display: 'Featured testimonials'
              fields:
                -
                  handle: number
                  field:
                    type: text
                    display: Number
                -
                  handle: text
                  field:
                    type: text
                    display: Text
