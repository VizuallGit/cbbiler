title: 'Image textbox'
fields:
  -
    handle: text
    field:
      buttons:
        - h2
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - anchor
      toolbar_mode: floating
      container: assets
      remove_empty_nodes: false
      type: bard
      display: Text
  -
    handle: image
    field:
      container: assets
      type: assets
      display: Image
      max_files: 1
  -
    handle: flip_content
    field:
      type: toggle
      display: 'Flip content'
